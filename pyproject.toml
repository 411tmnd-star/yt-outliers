[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-outliers"
version = "1.0.0"
description = "Find the YouTube videos that beat their own channel's normal."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
yt-outliers = "yt_outliers:main"

[tool.setuptools]
py-modules = ["yt_outliers"]
